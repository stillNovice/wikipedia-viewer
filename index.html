<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Viewer</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.6.2/css/bootstrap.min.css" 
          integrity="sha512-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" 
          crossorigin="anonymous">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
            crossorigin="anonymous"></script>

    <!-- Popper JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js" 
            integrity="sha512-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" 
            crossorigin="anonymous"></script>

    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.6.2/js/bootstrap.min.js" 
            integrity="sha512-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" 
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet">

  </head>

  <body>
    <div class="container">
      <div class="row justify-content-md-center">
        <div class="col col-sm-7">

          <h1 class="text-center">Search WIKI</h1>
          <br>
          <div class="searchIconAtStart text-center">
              <a href="#" onclick="showHideStuff(); return false;"><i class="material-icons orange md-96">search</i></a>
          </div>
          <div class="actualSearch">
            <div class="btn-group d-inline-block searchInputDiv">
                <input class="form-control form-control-lg round-border searchText" type="text" placeholder="Search Article...">
                <a href="#" onclick="$('.searchText').val(''); $('.searchText').focus(); return false;" class="inputClearIcon"><i class="material-icons">close</i></a>  
            </div>
            <div class="d-inline-block float-right searchBtnDiv">
                <button type="submit" class="btn btn-outline-dark btn-lg round-border searchBtn">Search!</button>
            </div>
          </div>
          <br>
          <div class="form-group text-center randomArticleDiv" style="margin: 10px;">
              <button type="submit" class="btn btn-primary btn-lg round-border randomArticleBtn" 
                      onclick="window.open('https://en.wikipedia.org/wiki/Special:Random'); return false;">Random Article</button>
          </div>
        </div>
      </div>
    </div>

    <br>
    <br>

    <!-- Search Results Section starts -->
    <div class="container" id="searchResultDiv">

    </div>
    <!-- Search Results Section ends -->

  </body>

  <script src="./js/main.js"></script>
</html>
